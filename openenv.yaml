version: "1.0"
environment:
  name: "Stock Market Monitoring Assistant"
  type: "reinforcement-learning"
  version: "2.0.1"
  endpoints:
    reset: "/reset"
    step: "/step"
    state: "/state"
  observation_space:
    shape: [5]
    type: "box"
    high: 1.0
    low: 0.0
    documentation:
      0: "Portfolio Risk Level [0, 1] (0.5+ is high, 0.8+ is critical)"
      1: "Market Volatility [0, 1]"
      2: "Error Signal (EMA of stress-induced decision errors) [0, 1]"
      3: "Time Pressure [0, 1] (Steps taken / Max steps)"
      4: "Last Action Taken (Scale: [ALERT=0, SILENT=0.5, INTERVENE=1.0])"
  action_space:
    type: "discrete"
    n: 3
    meanings: ["ALERT", "SILENT", "INTERVENE"]
    documentation:
      ALERT: "Issue a high-priority warning. Reduces risk but increases trader stress and noise."
      SILENT: "Continue monitoring without action. Risk increases naturally based on volatility."
      INTERVENE: "Direct market override. Drastic risk reduction but massive stress/fatigue cost."
tasks:
  - id: "stability_basic"
    difficulty: "easy"
    description: "Maintain market stability under low volatility conditions."
    target_score: 0.9
  - id: "volatility_spike"
    difficulty: "medium"
    description: "Handle a sudden market volatility spike and prevent risk escalation."
    target_score: 0.7
  - id: "market_crash"
    difficulty: "hard"
    description: "Recover the portfolio from a high-stress, critical risk state."
    target_score: 0.5
metadata:
  entrypoint: "app.py"
  inference_entrypoint: "inference.py"
  grader_entrypoint: "graders.py"
  docker:
    image: "python:3.11-slim"
    exposed_port: 7860
