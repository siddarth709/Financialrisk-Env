[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmarket-env"
version = "0.1.0"
description = "Stock Market Monitoring Assistant using RL to combat alert fatigue."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "stable-baselines3>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "gradio>=4.0.0",
    "openai",
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "gymnasium",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort"
]

[tool.setuptools]
packages = ["envs", "server"]
